<title>Between Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The Between Blocks plan screen, published as the claude.ai artifact. Same code as the local app (index.html);
     here the plan and log come from the artifact's cloud database and the camera coach is hidden. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/plan.css">
<div class="pg">
    <header class="pg-head">
      <div class="brand"><b>Between Blocks</b> <span class="block-label" id="block-label"></span></div>
      <button class="ghost head-btn" id="btn-beeps" type="button" aria-pressed="false">Beeps on</button>
      <button class="ghost head-btn" id="btn-fs" type="button">Full screen</button>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-today" aria-selected="true" aria-controls="view-today" type="button">Today</button>
        <button class="tab" role="tab" id="tab-progress" aria-selected="false" aria-controls="view-progress" type="button">Progress</button>
        <button class="tab" role="tab" id="tab-history" aria-selected="false" aria-controls="view-history" type="button">History</button>
      </nav>
    </header>

    <section id="view-today" role="tabpanel" aria-labelledby="tab-today">
      <div class="week" id="week" aria-label="Plan days"></div>
      <div id="day"></div>
    </section>

    <section id="view-progress" role="tabpanel" aria-labelledby="tab-progress" hidden>
      <div class="sec-head"><h2>Where each exercise stands</h2><span class="hint">last 8 results, oldest first</span></div>
      <ul class="prog" id="prog"></ul>
      <div id="coach-notes"></div>
    </section>

    <section id="view-history" role="tabpanel" aria-labelledby="tab-history" hidden>
      <div class="sec-head"><h2>Logged sessions</h2><span class="hint" id="hist-count"></span></div>
      <div class="hist-actions">
        <button class="ghost" id="btn-copylog" type="button">Copy last 14 days for Claude</button>
        <button class="ghost" id="btn-export" type="button">Download all progress (JSON)</button>
      </div>
      <p class="fine" id="hist-msg"></p>
      <div id="hist"></div>
      <details class="manual" id="manual">
        <summary>Add an entry by hand <span>for anything that isn't in the plan</span></summary>
        <div class="manual-body" id="groups"></div>
      </details>
      <p class="status" id="status"></p>
    </section>

    <footer class="pg-foot" id="foot"></footer>
  </div>
  <script type="module" src="js/planapp.js"></script>
